<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="glow3" cx="76%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#3776AB" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid3" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="#090909" />
  <rect width="1200" height="750" fill="url(#grid3)" />
  <rect width="1200" height="750" fill="url(#glow3)" />

  <!-- Top Brand Header -->
  <rect x="64" y="48" width="32" height="32" rx="6" fill="#FF5A1F" />
  <text x="80" y="70" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">QA</text>
  <text x="108" y="69" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Inventory<tspan fill="#FF5A1F">TestSuite</tspan></text>

  <!-- Main Editorial Headline -->
  <text x="64" y="255" fill="#FF5A1F" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="3">CALIDAD DE DATOS · DJANGO ORM &amp; UNIT TESTING</text>
  <text x="64" y="335" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="70" font-weight="900" letter-spacing="-2">CRUD &amp; Validación.</text>
  <text x="64" y="415" fill="#FF5A1F" font-family="system-ui, sans-serif" font-size="70" font-weight="900" letter-spacing="-2">Zero Corrupt Data.</text>

  <text x="64" y="478" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="19">Gestión de productos y categorías con validadores defensivos</text>
  <text x="64" y="506" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="19">y suite de pruebas unitarias automatizadas en Python.</text>

  <!-- Bottom Buttons Mock -->
  <rect x="64" y="555" width="180" height="46" rx="4" fill="#FF5A1F" />
  <text x="154" y="583" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">UNIT TESTS PASS</text>
  <rect x="260" y="555" width="175" height="46" rx="4" fill="#141414" stroke="#2E2E2E" />
  <text x="347" y="583" fill="#E4E4E7" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">MODEL FORMS</text>

  <!-- Stylized Terminal Test Runner on Right -->
  <g transform="translate(755, 205)">
    <rect x="0" y="0" width="335" height="330" rx="16" fill="#121212" stroke="#2A2A2A" stroke-width="2" />
    <text x="28" y="42" fill="#A1A1AA" font-family="monospace" font-size="12">$ python manage.py test</text>
    <line x1="28" y1="58" x2="307" y2="58" stroke="#262626" />
    <text x="28" y="95" fill="#34D399" font-family="monospace" font-size="13">✓ test_create_valid_product</text>
    <text x="28" y="128" fill="#34D399" font-family="monospace" font-size="13">✓ test_reject_negative_price</text>
    <text x="28" y="161" fill="#34D399" font-family="monospace" font-size="13">✓ test_category_integrity</text>
    <text x="28" y="194" fill="#34D399" font-family="monospace" font-size="13">✓ test_update_stock_atomic</text>

    <rect x="28" y="226" width="279" height="76" rx="10" fill="#18181B" stroke="#34D399" stroke-opacity="0.4" />
    <text x="48" y="258" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="bold">Ran 12 tests in 0.08s</text>
    <text x="48" y="282" fill="#34D399" font-family="monospace" font-size="13" font-weight="bold">STATUS: OK (100% PASSED)</text>
  </g>

  <rect x="0" y="742" width="1200" height="8" fill="#FF5A1F" />
