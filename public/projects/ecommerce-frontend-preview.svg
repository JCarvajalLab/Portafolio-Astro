  <text x="108" y="69" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Frontend<tspan fill="#FF5A1F">Store</tspan></text>

  <!-- Main Editorial Headline -->
  <text x="64" y="255" fill="#FF5A1F" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="3">FRONTEND SEMÁNTICO · VUE.JS &amp; JAVASCRIPT</text>
  <text x="64" y="335" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="70" font-weight="900" letter-spacing="-2">Clean UI Grid.</text>
  <text x="64" y="415" fill="#FF5A1F" font-family="system-ui, sans-serif" font-size="70" font-weight="900" letter-spacing="-2">Mobile First.</text>

  <text x="64" y="478" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="19">Arquitectura web modular con HTML5 semántico, CSS Grid,</text>
  <text x="64" y="506" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="19">JavaScript ES6+ y componentes reactivos en Vue.js.</text>

  <!-- Bottom Buttons Mock -->
  <rect x="64" y="555" width="180" height="46" rx="4" fill="#FF5A1F" />
  <text x="154" y="583" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">RESPONSIVE UI</text>
  <rect x="260" y="555" width="175" height="46" rx="4" fill="#141414" stroke="#2E2E2E" />
  <text x="347" y="583" fill="#E4E4E7" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">VUE.JS &amp; ES6+</text>

