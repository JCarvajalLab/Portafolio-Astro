<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="glow4" cx="76%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#41B883" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid4" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="#090909" />
  <rect width="1200" height="750" fill="url(#grid4)" />
  <rect width="1200" height="750" fill="url(#glow4)" />

  <!-- Top Brand Header -->
  <rect x="64" y="48" width="32" height="32" rx="6" fill="#41B883" />
