<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="glow2" cx="75%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#092E20" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid2" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="#090909" />
  <rect width="1200" height="750" fill="url(#grid2)" />
  <rect width="1200" height="750" fill="url(#glow2)" />

  <!-- Top Brand Header -->
  <rect x="64" y="48" width="32" height="32" rx="6" fill="#092E20" stroke="#44B78B" />
  <text x="80" y="70" fill="#44B78B" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">dj</text>
  <text x="108" y="69" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Django<tspan fill="#FF5A1F">Commerce</tspan></text>

  <!-- Main Editorial Headline -->
  <text x="64" y="255" fill="#FF5A1F" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="3">ARQUITECTURA MVT · PYTHON &amp; POSTGRESQL</text>
  <text x="64" y="335" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="70" font-weight="900" letter-spacing="-2">Full Stack Store.</text>
  <text x="64" y="415" fill="#FF5A1F" font-family="system-ui, sans-serif" font-size="70" font-weight="900" letter-spacing="-2">Django &amp; SQL.</text>

  <text x="64" y="478" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="19">Autenticación de usuarios, carrito transaccional, gestión</text>
  <text x="64" y="506" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="19">de órdenes y panel administrativo con control de roles.</text>

  <!-- Bottom Buttons Mock -->
  <rect x="64" y="555" width="180" height="46" rx="4" fill="#FF5A1F" />
  <text x="154" y="583" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">DJANGO ORM</text>
  <rect x="260" y="555" width="175" height="46" rx="4" fill="#141414" stroke="#2E2E2E" />
  <text x="347" y="583" fill="#E4E4E7" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">POSTGRESQL DB</text>

  <!-- Stylized Backend Architecture Box on Right -->
  <g transform="translate(760, 200)">
    <rect x="0" y="0" width="330" height="340" rx="16" fill="#121212" stroke="#2A2A2A" stroke-width="2" />
    <text x="28" y="42" fill="#44B78B" font-family="monospace" font-size="13" font-weight="bold">models.py · PostgreSQL</text>
    <line x1="28" y1="58" x2="302" y2="58" stroke="#262626" />
    <text x="28" y="92" fill="#60A5FA" font-family="monospace" font-size="13">class <tspan fill="#FBBF24">Order</tspan>(models.Model):</text>
    <text x="44" y="122" fill="#E4E4E7" font-family="monospace" font-size="12">user = ForeignKey(User)</text>
    <text x="44" y="148" fill="#E4E4E7" font-family="monospace" font-size="12">total = DecimalField()</text>
    <text x="44" y="174" fill="#E4E4E7" font-family="monospace" font-size="12">status = CharField()</text>

    <rect x="28" y="210" width="274" height="96" rx="10" fill="#18181B" stroke="#FF5A1F" stroke-opacity="0.45" />
    <text x="48" y="244" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="bold">✓ AUTH &amp; CSRF PROTECTION</text>
    <text x="48" y="270" fill="#FF5A1F" font-family="monospace" font-size="12">✓ PERSISTENCIA RELACIONAL</text>
    <text x="48" y="292" fill="#A1A1AA" font-family="monospace" font-size="11">✓ CARRITO DINÁMICO EN SESIÓN</text>
  </g>

  <rect x="0" y="742" width="1200" height="8" fill="#FF5A1F" />
</svg>
